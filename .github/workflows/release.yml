name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package tarball and SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME//\//-}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="kagami-${VERSION}-${TARGET}"
          STAGE="dist/${ARCHIVE}"
          mkdir -p "${STAGE}"
          cp "target/${TARGET}/release/kagami" "${STAGE}/kagami"
          cp LICENSE README.md "${STAGE}/"
          tar -C dist -czf "dist/${ARCHIVE}.tar.gz" "${ARCHIVE}"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
            else
              shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
            fi
          )
          rm -rf "${STAGE}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: kagami-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine SHA256 checksums
        run: |
          set -euo pipefail
          cat dist/*.tar.gz.sha256 | sort -k2 > dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS.txt
